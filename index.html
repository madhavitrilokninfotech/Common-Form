<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Common Input Form</title>

    <!-- FONT Family -->
    <link rel="stylesheet" type="text/css" href="assets/font/font-family/stylesheet.css">
    <link rel="stylesheet" type="text/css" href="assets/font/font-awesome/css/font-awesome.min.css">

    <!-- CSS Links -->
    <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/bootstrap-datetimepicker.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/select2.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
    <link rel="stylesheet" type="text/css" href="assets/css/media.css">

</head>

<body>
    <!-- Form -->
    <div class="form-container">
        <div class="form-wrapper">
            <div class="form-header">
                <h1 class="form-title mb-0">Common Input Form</h1>
            </div>
            <div class="form-body">
                <form action="" id="RegistrationForm" class="form">
                    <!-- Full Name & Email Field -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="field-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control border" placeholder="Enter Your Name"
                                    autocomplete="name" id="FullName">
                                <small class="error-msg" id="nameError"></small>
                            </div>

                        </div>
                        <div class="col-md-6">
                            <div class="field-group">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control border" placeholder="Enter Your Email"
                                    autocomplete="email" id="Email">
                                <small class="error-msg" id="emailError"></small>
                            </div>
                        </div>
                    </div>

                    <!-- Password Fields > Custom -->
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="field-group">
                                <label class="form-label">Password</label>
                                <div class="password-wrapper">
                                    <input type="password" id="password" class="form-control border"
                                        placeholder="Enter password">
                                    <span class="toggle-password" data-target="password">
                                        <i class="fa fa-eye"></i>
                                    </span>
                                </div>
                                <small class="error-msg" id="passwordError"></small>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <!-- Confirm Password Field -->
                            <div class="field-group">
                                <label class="form-label">Confirm Password</label>
                                <div class="password-wrapper">
                                    <input type="password" id="confirmPassword" class="form-control border"
                                        placeholder="Confirm password">
                                    <span class="toggle-password" data-target="confirmPassword">
                                        <i class="fa fa-eye"></i>
                                    </span>
                                </div>
                                <small class="error-msg" id="confirmPasswordError"></small>
                            </div>
                        </div>
                    </div>
                    <!-- end -->

                    <!-- Phone number with country code (Australian format) > Custom -->
                    <div class="field-group">
                        <label class="form-label">Phone Number</label>
                        <div class="phone-wrapper">
                            <span class="country-code input-group-text">+61</span>
                            <input type="tel" id="phoneNumber" class="form-control border" placeholder="4XXX XXX XXX"
                                maxlength="12">
                        </div>
                        <small class="error-msg" id="phoneError"></small>
                    </div>
                    <!-- end -->


                    <!-- Radio Button & Checkbox v1 > Custom -->
                    <div class="row">
                        <div class="col-lg-6">
                            <!-- Radio Button > Custom -->
                            <div class="field-group">
                                <label class="form-label">Select Gender</label>
                                <div class="radio-field-wrap">
                                    <label class="option-item">
                                        <input type="radio" name="gender" value="male">
                                        <div class="radiobtn"></div>
                                        <div class="content">
                                            <h6 class="mb-0">Male</h6>
                                        </div>
                                    </label>

                                    <label class="option-item">
                                        <input type="radio" name="gender" value="female" checked>
                                        <div class="radiobtn"></div>
                                        <div class="content">
                                            <h6 class="mb-0">Female</h6>
                                        </div>
                                    </label>
                                </div>
                            </div>
                            <!-- end -->
                        </div>
                        <div class="col-lg-6">
                            <!-- Checkbox Button > Custom -->
                            <div class="field-group">
                                <label class="form-label">Select Interests</label>
                                <div class="radio-field-wrap">
                                    <label class="option-item">
                                        <input type="checkbox" value="design">
                                        <div class="checkmark"></div>
                                        <div class="content">
                                            <h6 class="mb-0">Design</h6>
                                        </div>
                                    </label>

                                    <label class="option-item">
                                        <input type="checkbox" value="development" checked>
                                        <div class="checkmark"></div>
                                        <div class="content">
                                            <h6 class="mb-0">Development</h6>
                                        </div>
                                    </label>

                                    <label class="option-item">
                                        <input type="checkbox" value="marketing">
                                        <div class="checkmark"></div>
                                        <div class="content">
                                            <h6 class="mb-0">Marketing</h6>
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <!-- end -->
                        </div>
                    </div>

                    <!-- Tag-style Radio Button & Checkbox v2 > Custom -->
                    <div class="field-group">
                        <label class="form-label">Tags</label>
                        <div class="tag-group">
                            <label class="tag-item">
                                <input type="checkbox" id="tagReview" name="tags" value="Review">
                                <span class="tag">#Review</span>
                            </label>

                            <label class="tag-item">
                                <input type="checkbox" id="tagFeedback" name="tags" value="Feedback">
                                <span class="tag">#Feedback</span>
                            </label>

                            <label class="tag-item">
                                <input type="checkbox" id="tagUI" name="tags" value="UI" checked>
                                <span class="tag">#UI</span>
                            </label>

                            <label class="tag-item">
                                <input type="checkbox" id="tagUX" name="tags" value="UX" checked>
                                <span class="tag">#UX</span>
                            </label>

                            <label class="tag-item">
                                <input type="checkbox" id="tagAnalysis" name="tags" value="Analysis">
                                <span class="tag">#Analysis</span>
                            </label>

                            <label class="tag-item">
                                <input type="checkbox" id="tagSummary" name="tags" value="Summary">
                                <span class="tag">#Summary</span>
                            </label>

                            <label class="tag-item">
                                <input type="checkbox" id="tagEvaluation" name="tags" value="Evaluation">
                                <span class="tag">#Evaluation</span>
                            </label>
                        </div>

                        <small class="error-msg" id="tagError"></small>
                    </div>

                                        </g>
                                    </svg>
                                    Remote
                                </span>
                            </label>

                                <input type="radio" id="WorkFreelance" name="WorkType" value="Freelance">

                                    Freelance

                        </div>
                        <small class="error-msg" id="WorkTypeError"></small>
                    </div>

                    <!-- Toggle Button Fields > Custom -->
                    <div class="field-group">
                        <div class="toggle-card">
                            <div class="toggle-content">
                                <div class="icon-box">
                                    <img src="./assets/images/cal-img.svg" alt="">
                                </div>
                                <div class="text-content">
                                    <span class="subtitle">Show in Calendar</span>
                                    <p class="mt-1 mb-0">Add this task to your calendar view</p>
                                </div>
                            </div>

                            <label class="switch">
                                <input type="checkbox" id="calendarToggle" class="checkbox">
                                <span class="toggleslide"></span>
                            </label>
                        </div>
                    </div>
                    <!-- end -->

                    <!-- Toggle Input Switch > Custom -->
                    <div class="field-group">
                        <div class="switch-toggle-wrap">
                            <label class="switch-toggle-label free">
                                <input type="radio" name="plan" value="free" checked>
                                <span class="labeltext">Free</span>
                            </label>

                            <label class="switch-toggle-label premium">
                                <input type="radio" name="plan" value="premium">
                                <span class="labeltext">Premium</span>
                            </label>
                            <span class="slide-bg"></span>
                        </div>
                    </div>
                    <!-- end -->

                    <!-- Multi Select Dropdown Fields > Custom -->
                    <div class="field-group">
                        <label class="form-label">Multi Select Options</label>
                        <div class="custom-multiselect">
                            <select name="customSelect" id="customSelect" class="form-control border" multiple>
                                <option value="Meetings">#Meetings</option>
                                <option value="Work">#Work</option>
                                <option value="Clients">#Clients</option>
                                <option value="Review">#Review</option>
                                <option value="Feedback">#Feedback</option>
                                <option value="Analysis">#Analysis</option>
                            </select>
                        </div>
                    </div>
                    <!-- end -->

                    <!-- Input Range Single Slider -->
                    <div class="field-group">
                        <label class="form-label">Input Range Single Slider</label>
                        <div class="input-range-slider">

                            <div class="range-slider">
                                <input type="range" min="0" max="100" value="0" class="range-input" id="range"
                                    step="25" />
                                <div class="sliderticks">
                                    <span>0</span>
                                    <span>25</span>
                                    <span>50</span>
                                    <span>75</span>
                                    <span>100</span>
                                </div>
                            </div>

                            <div class="total-value">
                                <p class="mb-1">Total</p>
                                <div class="value">0</div>
                            </div>
                        </div>
                    </div>
                    <!-- end -->

                    <!-- Input Range Double Slider -->
                    <div class="field-group">
                        <label class="form-label">Input Range Double Slider</label>
                        <div class="double-range-slider">
                            <div class="vals-row">
                                <p class="mb-0 fw-semibold">Selected Price</p>
                                <div class="value-selected-range">
                                    <span class="val-badge" id="val_min">From
                                        <input type="number" class="marktext" id="input_min" value="0" min="0"
                                            max="500" />
                                    </span>
                                    <span class="val-badge" id="val_max">To
                                        <input type="number" class="marktext" id="input_max" value="400" min="0"
                                            max="500" />
                                    </span>
                                </div>
                            </div>
                            <!-- <div id="minMsg"></div> -->

                            <div class="double-range-wrap range-slider">
                                <div class="track-bg"></div>
                                <div class="track-fill" id="fill"></div>
                                <input type="range" min="0" max="500" value="0" class="range-input" id="range_min"
                                    step="1" />
                                <input type="range" min="0" max="500" value="400" class="range-input" id="range_max"
                                    step="1" />
                            </div>
                        </div>
                    </div>
                    <!-- end -->

                    <!-- Date Picker using flatpickr library-->
                    <!-- <div class="field-group">
                        <label class="form-label">Select Date</label>
                        <input id="datepicker" placeholder="Select date" class="form-control border datepicker">
                    </div> -->

                    <!-- Custom Create Date,Time Picker -->
                    <div class="field-group">
                        <div class="row">
                            <div class="col-sm-6 mb-3 mb-sm-0">
                                <div class="custom-datetime">
                                    <label class="form-label">Select Date</label>
                                    <input type="text" class="form-control border custom_date_pickr" id="myDatePicker"
                                        name="myDatePicker" placeholder="Select Date">
                                </div>
                            </div>
                            <div class="col-sm-6 mb-sm-0">
                                <div class="custom-datetime">
                                    <label class="form-label">Select Time</label>
                                    <input type="text" class="form-control border custom_time_pickr" id="myTimePicker"
                                        name="myTimePicker" placeholder="Select Time">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Custom Create Date range Picker -->
                    <div class="field-group">
                        <div class="row">
                            <div class="col-sm-6 mb-sm-0">
                                <div class="custom-datetime">
                                    <label class="form-label">Select Date Range</label>
                                    <div class="input-daterange">
                                        <input type="text" class="form-control border custom_date_range_pickr"
                                            id="myDateRange" name="myDateRange" placeholder="Select Date Range"
                                            inputmode="none">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Textarea Field -->
                    <div class="field-group">
                        <label class="form-label">Message</label>
                        <textarea class="form-control border" placeholder="Enter your message" id="message"
                            name="message" rows="4" maxlength="200"></textarea>
                        <small class="error-msg" id="messageError"></small>
                    </div>
                    <!-- end -->

                    <!-- Upload Document > Custom -->
                    <div class="field-group file-upload-field">
                        <label class="form-label">Upload File</label>
                        <div class="upload-box" id="uploadBox">
                            <input type="file" id="fileInput" multiple hidden>
                            <img src="assets/images/file-upload-icon.svg" alt="file upload icon"
                                class="file-upload-icon">
                            <p>Choose a file or drag & drop it here.</p>
                            <small>Only support .jpg, .jpeg, .png format.</small>
                        </div>
                        <div id="filePreview"></div>
                    </div>

                    <!-- end -->

                    <button type="submit" id="submitBtn" class="btn btn-submit">
                        <span class="btn-submittext">Submit</span>
                        <span class="btn-loader"></span>
                    </button>
                    <!-- Success Message -->
                    <span id="formMsg" class="form-msg"></span>

                </form>
            </div>
        </div>
