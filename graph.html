    <!-- Donut chart JS -->
    <script>
        // Order status data
        let orderData = [
            { status: 'Completed', count: 850, color: '#2ecc71', icon: '✅' },
            { status: 'Processing', count: 320, color: '#3498db', icon: '⚙️' },
            { status: 'Pending', count: 180, color: '#f39c12', icon: '⏳' },
            { status: 'Cancelled', count: 120, color: '#e74c3c', icon: '❌' },
            { status: 'Refunded', count: 80, color: '#9b59b6', icon: '💰' }
        ];

        let animationProgress = 1;
        let showLabels = true;

        const CANVAS_SIZE = 350;
        const OUTER_RADIUS = 140;
        const INNER_RADIUS = 90;

        // Setup canvas for HD screens
        function setupCanvas() {
            const canvas = document.getElementById('orderChart');
            const ctx = canvas.getContext('2d');

            const parent = canvas.parentElement;
            const size = parent.clientWidth; // responsive width

            const dpr = window.devicePixelRatio || 1;

            canvas.width = CANVAS_SIZE * dpr;
            canvas.height = CANVAS_SIZE * dpr;

            canvas.style.width = CANVAS_SIZE + "px";
            canvas.style.height = CANVAS_SIZE + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            return { canvas, ctx, size };
        }

        // Draw donut chart
        function drawDonutChart() {
            const { canvas, ctx } = setupCanvas();

            const centerX = CANVAS_SIZE / 2;
            const centerY = CANVAS_SIZE / 2;

            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            const total = orderData.reduce((sum, item) => sum + item.count, 0);

            let currentAngle = -Math.PI / 2;

            orderData.forEach((item) => {
                const sliceAngle = (item.count / total) * 2 * Math.PI * animationProgress;
                const middleAngle = currentAngle + sliceAngle / 2;

                // Draw slice
                ctx.beginPath();
                ctx.arc(centerX, centerY, OUTER_RADIUS, currentAngle, currentAngle + sliceAngle);
                ctx.arc(centerX, centerY, INNER_RADIUS, currentAngle + sliceAngle, currentAngle, true);
                ctx.closePath();

                // Gradient
                const gradient = ctx.createRadialGradient(centerX, centerY, INNER_RADIUS, centerX, centerY, OUTER_RADIUS);
                gradient.addColorStop(0, item.color);
                gradient.addColorStop(1, lightenColor(item.color, 0.2));

                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 3;
                ctx.stroke();

                // Labels
                if (showLabels && animationProgress === 1 && sliceAngle > 0.3) {
                    const labelRadius = (OUTER_RADIUS + INNER_RADIUS) / 2;
                    const labelX = centerX + Math.cos(middleAngle) * labelRadius;
                    const labelY = centerY + Math.sin(middleAngle) * labelRadius;

                    const percentage = ((item.count / total) * 100).toFixed(1) + "%";

                    ctx.font = "normal 10px Arial";
                    const textWidth = ctx.measureText(percentage).width;

                    ctx.fillStyle = item.color;
                    const paddingX = 10;
                    const paddingY = 10;
                    const rectWidth = textWidth + paddingX * 2;
                    const rectHeight = 16;
                    const borderRadius = 4;


                    const x = labelX - rectWidth / 2;
                    const y = labelY - rectHeight / 2;

                    //  Rounded rectangle
                    ctx.beginPath();
                    ctx.moveTo(x + borderRadius, y);
                    ctx.lineTo(x + rectWidth - borderRadius, y);
                    ctx.quadraticCurveTo(x + rectWidth, y, x + rectWidth, y + borderRadius);
                    ctx.lineTo(x + rectWidth, y + rectHeight - borderRadius);
                    ctx.quadraticCurveTo(x + rectWidth, y + rectHeight, x + rectWidth - borderRadius, y + rectHeight);
                    ctx.lineTo(x + borderRadius, y + rectHeight);
                    ctx.quadraticCurveTo(x, y + rectHeight, x, y + rectHeight - borderRadius);
                    ctx.lineTo(x, y + borderRadius);
                    ctx.quadraticCurveTo(x, y, x + borderRadius, y);
                    ctx.closePath();

                    ctx.fillStyle = item.color;
                    ctx.fill();

                    // Optional border
                    // ctx.strokeStyle = "#fff";
                    // ctx.lineWidth = 1;
                    // ctx.stroke();

                    //  Black background
                    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                    ctx.fill();

                    // Text
                    ctx.fillStyle = "#fff";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(percentage, labelX, labelY);
                }

                currentAngle += sliceAngle;
            });

            canvas.orderData = orderData;
            canvas.total = total;
        }

        // Legend
        function createLegend() {
            const breakdown = document.getElementById('breakdown');
            breakdown.innerHTML = '';

            orderData.forEach((item) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="status-info">
                        <div class="status-dot" style="background-color:${item.color}"></div>
                        <span>${item.status}</span>
                    </div>
                    <span>${item.count} orders</span>
                `;
                breakdown.appendChild(li);
            });
        }

        // Stats
        function updateStats() {
            const total = orderData.reduce((sum, item) => sum + item.count, 0);
            document.getElementById('totalOrders').textContent = total;
        }

        // Hover detection
        function getSliceAtPosition(canvas, x, y) {
            const rect = canvas.getBoundingClientRect();

            const mouseX = (x - rect.left) * (CANVAS_SIZE / rect.width);
            const mouseY = (y - rect.top) * (CANVAS_SIZE / rect.height);

            const centerX = CANVAS_SIZE / 2;
            const centerY = CANVAS_SIZE / 2;

            const dx = mouseX - centerX;
            const dy = mouseY - centerY;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance >= INNER_RADIUS && distance <= OUTER_RADIUS) {
                let angle = Math.atan2(dy, dx) + Math.PI / 2;
                if (angle < 0) angle += 2 * Math.PI;

                let currentAngle = 0;
                const total = canvas.total;

                for (let item of canvas.orderData) {
                    const sliceAngle = (item.count / total) * 2 * Math.PI;
                    if (angle >= currentAngle && angle < currentAngle + sliceAngle) {
                        return item;
                    }
                    currentAngle += sliceAngle;
                }
            }

            return null;
        }

        // Tooltip
        function showTooltip(e, data) {
            const tooltip = document.getElementById('tooltip');
            const total = orderData.reduce((s, i) => s + i.count, 0);
            const pct = ((data.count / total) * 100).toFixed(1);

            tooltip.innerHTML = `
                <strong>${data.status}</strong><br>
                Orders: ${data.count}<br>
                ${pct}%
            `;

            tooltip.style.left = e.clientX + 10 + "px";
            tooltip.style.top = e.clientY - 10 + "px";
            tooltip.classList.add("show");
        }

        function hideTooltip() {
            document.getElementById('tooltip').classList.remove("show");
        }

        // Interactions
        function setupInteractions() {
            const canvas = document.getElementById('orderChart');

            canvas.addEventListener('mousemove', (e) => {
                const slice = getSliceAtPosition(canvas, e.clientX, e.clientY);

                if (slice) {
                    showTooltip(e, slice);
                    canvas.style.cursor = "pointer";
                } else {
                    hideTooltip();
                    canvas.style.cursor = "default";
                }
            });

            canvas.addEventListener('mouseleave', hideTooltip);
        }

        // Colors
        function lightenColor(color, factor) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);

            return `rgb(${Math.floor(r + (255 - r) * factor)},
                ${Math.floor(g + (255 - g) * factor)},
                ${Math.floor(b + (255 - b) * factor)})`;
        }

        // Animation
        function animateChart() {
            animationProgress = 0;
            const duration = 1200;
            const start = Date.now();

            function frame() {
                const elapsed = Date.now() - start;
                animationProgress = Math.min(elapsed / duration, 1);
                animationProgress = 1 - Math.pow(1 - animationProgress, 3);

                drawDonutChart();

                if (animationProgress < 1) {
                    requestAnimationFrame(frame);
                } else {
                    updateStats();
                }
            }

            frame();
        }


        // Init
        function renderChart() {
            drawDonutChart();
            createLegend();
            updateStats();
        }

        // Start
        renderChart();
        setupInteractions();

    </script>
